<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Портфолио фуллстек-разработчика Богдана Сутужко: проекты, опыт, стек технологий (React, Vue, Node, NestJS, TypeScript) и интерактивный терминал."
    />
    <!-- Под тёмную тему, она по умолчанию. -->
    <meta name="theme-color" content="#0d1117" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Трюк с media="print" не даёт шрифтам блокировать первую отрисовку: сначала
         показываем системный шрифт, потом подменяем. На слабых телефонах FCP заметно лучше. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      />
    </noscript>

    <title>Bogdan Sutuzhko — Full Stack Developer</title>

    <!-- Ставим тему до первого кадра, чтобы не мигала. Сначала выбор гостя, потом
         системная. Если нет ни того, ни другого, тему из настроек применит React. -->
    <script>
      (() => {
        try {
          const chosen = localStorage.getItem('portfolio.theme');
          if (chosen === 'light' || chosen === 'dark') {
            document.documentElement.dataset.theme = chosen;
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.dataset.theme = 'dark';
          } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
            document.documentElement.dataset.theme = 'light';
          }
          /* иначе ждём settings.defaultTheme */
        } catch {
          /* без localStorage или matchMedia остаётся тема по умолчанию */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
